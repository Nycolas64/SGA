<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Sistema de Gestão Acadêmica</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="sidebar">
    <div class="logo-area">
        <h1 class="logo-text">SGA</h1>
        <span class="user-role-text">Papel: Gestor</span>
    </div>
    <nav class="nav-links">
        <button class="nav-item" onclick="mostrarSecao('solicitacoes')" id="btnNavSolicitacoes">
            <i class="fas fa-bell"></i> Solicitações
        </button>
        <button class="nav-item active" onclick="mostrarSecao('mapa')" id="btnNavMapa">
            <i class="fas fa-map"></i> Ambientes
        </button>
        <button class="nav-item" onclick="mostrarSecao('equipamentos')" id="btnNavEquipamentos">
            <i class="fas fa-tools"></i> Equipamentos
        </button>
        <button class="nav-item"><i class="fas fa-cog"></i> Configurações</button>
    </nav>
</div>

<div id="secao-mapa" class="main-content">
    <header class="main-header">
        <div class="header-top">
            <div class="back-circle-decoration">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="header-labels">
                <span class="label-sala">Sala:</span>
                <span class="label-equip">Equipamento:</span>
            </div>
        </div>
    </header>

    <div class="data-table">
        <div id="listaAmbientes" class="table-body"></div>
    </div>

    <button class="btn-add-action" onclick="abrirModalAmbiente()">Adicionar nova sala</button>
</div>

<div id="secao-equipamentos" class="main-content" style="display: none;">
    <header class="main-header">
        <div class="header-top">
            <div class="back-circle-decoration">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="header-labels">
                <span class="label-sala">Gerenciamento de Equipamentos:</span>
            </div>
        </div>
    </header>

    <div class="data-table">
        <div id="listaEquipamentos" class="table-body"></div>
    </div>

    <button class="btn-add-action" onclick="abrirModalEquipamento()">Adicionar novo equipamento</button>
</div>

<div id="secao-solicitacoes" class="main-content" style="display: none;">
    <header class="main-header">
        <div class="tabs-container">
            <button class="tab-btn active" onclick="carregarSolicitacoes('PENDENTE')">Pendentes</button>
            <button class="tab-btn" onclick="carregarSolicitacoes('APROVADA')">Aprovadas</button>
            <button class="tab-btn" onclick="carregarSolicitacoes('REJEITADA')">Rejeitadas</button>
            <button class="tab-btn" onclick="carregarSolicitacoes('EXPIRADA')">Expiradas</button>
            <button class="tab-btn toggle-view-btn" onclick="alternarVisualizacao()" style="margin-left: auto; background-color: var(--unifil-dark); color: var(--white); border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer;">
                <i class="fas fa-list"></i> Alternar Exibição
            </button>
        </div>
    </header>

    <div class="cards-container">
        <div id="listaSolicitacoes" class="cards-grid">
        </div>
    </div>
</div>

<div id="modalAmbiente" class="modal">
    <div class="modal-window">
        <h2 id="modalTitle">ADICIONANDO NOVA SALA</h2>
        <form id="formAmbiente">
            <div class="field-box">
                <label>Nome do Ambiente</label>
                <input type="text" id="campoNome" placeholder="Digite a sala" required>
            </div>
            <div class="field-box">
                <label>Capacidade</label>
                <input type="number" id="campoCapacidade" placeholder="Capacidade física" required>
            </div>
            <div class="field-box">
                <label>Equipamentos Disponíveis</label>
                <div id="checkboxesEquipamentos" style="display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow-y: auto; padding: 10px; border: 1px solid var(--row-gray); border-radius: 5px; background: #f9f9f9; color: var(--unifil-dark);"></div>
            </div>
            <div class="field-box">
                <label>Descrição</label>
                <textarea id="campoDescricao" placeholder="Digite a descrição"></textarea>
            </div>
            <div class="actions-box">
                <button type="submit" class="btn-confirm">Salvar</button>
                <button type="button" id="btnExcluirModal" class="btn-delete-modal" onclick="deletarNoModal()">Excluir</button>
                <button type="button" class="btn-close" onclick="fecharModalAmbiente()">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<div id="modalEquipamento" class="modal">
    <div class="modal-window">
        <h2 id="modalEquipamentoTitle">ADICIONANDO EQUIPAMENTO</h2>
        <form id="formEquipamento">
            <div class="field-box">
                <label>Nome do Equipamento</label>
                <input type="text" id="campoNomeEquipamento" placeholder="Ex: Projetor, TV, Caixa de Som" required>
            </div>
            <div class="actions-box">
                <button type="submit" class="btn-confirm">Salvar</button>
                <button type="button" class="btn-close" onclick="fecharModalEquipamento()">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<div id="modalDetalhesSolicitacao" class="modal">
    <div class="modal-window">
        <h2 id="detalheNomeProfessor">DETALHES DO PEDIDO</h2>
        <div class="info-detalhe">
            <p><strong>Sala:</strong> <span id="detalheSala"></span></p>
            <p><strong>Data:</strong> <span id="detalheData"></span></p>
            <p><strong>Horário:</strong> <span id="detalheHorario"></span></p>
            <p><strong>Público:</strong> <span id="detalhePublico"></span></p>
            <p><strong>Motivo:</strong> <span id="detalheMotivo"></span></p>
            <p><strong>Descrição:</strong> <span id="detalheDescricao"></span></p>
        </div>
        <div class="actions-box">
            <button class="btn-confirm" onclick="atualizarStatus('APROVADA')">Aprovar</button>
            <button class="btn-delete-modal" onclick="atualizarStatus('REJEITADA')">Rejeitar</button>
            <button class="btn-close" onclick="fecharModalDetalhes()">Fechar</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
